name: Validate plugin registry

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# PR branches get one run via pull_request; pushes to main and v* tags run
# directly. A new push cancels the superseded run for the same ref.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      # Full history: scripts/published_lock.py reads `main`'s registry.json
      # through git to learn which plugin versions are actually published.
      # Without it the publication-completeness check degrades to trusting
      # the ledger's own roster.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Editable install smoke test (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q

      - name: Documentation link and routing check
        run: python scripts/check_docs_links.py

      - name: Validate registry
        run: python scripts/validate_registry.py

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install Ruff
        run: pip install "ruff>=0.4"
      - name: Ruff check (E4/E7/E9/F)
        run: ruff check scripts tests plugins

  # Blocking consumer-contract gate: the proposed registry revision (this
  # PR/commit checkout, never plugin `main`) must satisfy the real plugin
  # contract suite of the latest supported application release.
  #
  # Advancing APPLICATION_REF: when a new application release becomes the
  # oldest supported consumer (its contract expectations change), update the
  # ref below in a dedicated PR and record it in docs/CONSUMER_CONTRACT.md.
  # The ref is always an immutable application tag or commit SHA, never a
  # branch.
  #
  # Status: BLOCKING. The pin is an immutable schema-3/4 capable application
  # commit, so capability-aware contract expectations hold and the job must
  # pass before a registry change may merge. Replace the commit SHA with the
  # corresponding immutable release tag once such a release is published.
  # The `validate` job remains the second blocking capability gate: its
  # validate_registry schema floor check fails closed when a payload schema
  # is newer than its declared minimum application version.
  consumer-contract:
    name: Consumer contract (schema-capable application pin)
    runs-on: ubuntu-latest
    env:
      # Keep this comment block beside the ref. See docs/CONSUMER_CONTRACT.md
      # for the advancement procedure.
      # Immutable application commit pin (never a branch). This commit is the
      # first application state that validates cluster-profile schemas 3 and
      # 4; the published v1.5.8 release (063d83b5) supports schemas 1-2 only
      # and therefore cannot validate the current registry. Replace with the
      # immutable release tag when a schema-3/4 capable release is published.
      APPLICATION_REF: 68a492a5dcdec842ed9dcbbd24b2fa22b0c45357
      HPC_GUI_CONTRACT_REPO: ${{ github.workspace }}/hpc-client-gui-plugins
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hpc-client-gui-plugins
      - name: Check out the pinned application release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mskomek/hpc-client-gui
          ref: ${{ env.APPLICATION_REF }}
          path: hpc-client-gui
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install contract test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest packaging jsonschema
      - name: Run application plugin contract
        working-directory: hpc-client-gui
        env:
          PYTHONPATH: src
        run: >
          python -m pytest tests/test_plugin_contract.py
          -q --tb=short -rf
