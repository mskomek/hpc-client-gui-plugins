name: Validate plugin registry

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: python -m pip install pytest jsonschema packaging

      - name: Run tests
        run: python -m pytest tests -q

      - name: Documentation link and routing check
        run: python scripts/check_docs_links.py

      - name: Validate registry
        run: python scripts/validate_registry.py

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install "ruff>=0.4"
      - name: Ruff check (E4/E7/E9/F)
        run: ruff check scripts tests
