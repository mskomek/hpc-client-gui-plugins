[project]
name = "hpc-client-gui-plugins"
version = "0.1.0"
description = "Validation tooling for the official HPC Client GUI plugin registry"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4.18",
    "packaging>=23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
